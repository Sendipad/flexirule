name: Start Jules Task

on:
  schedule:
    # Daily scheduled audit targeting develop branch at 02:00 UTC
    - cron: "0 2 * * *"
  # The GitHub connector can hand off a task through an authorized /jules comment.
  issue_comment:
    types: [created]
  # Manual and API callers provide the base branch and prompt explicitly.
  workflow_dispatch:
    inputs:
      prompt:
        description: "Complete task prompt for Jules"
        required: true
        type: string
      base_branch:
        description: "Repository branch Jules should start from"
        required: true
        type: string
        default: develop
      task_title:
        description: "Optional Jules session title"
        required: false
        type: string
        default: "FlexiRule task"

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  # Do not cancel a task that has already been submitted to Jules.
  group: jules-task-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  start-jules:
    name: Create Jules session
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'issue_comment' &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association) &&
        startsWith(github.event.comment.body, '/jules')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate and prepare request
        id: request
        env:
          EVENT_NAME: ${{ github.event_name }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          INPUT_PROMPT: ${{ inputs.prompt }}
          INPUT_TITLE: ${{ inputs.task_title }}
          INPUT_BRANCH: ${{ inputs.base_branch }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import subprocess
          import urllib.error
          import urllib.parse
          import urllib.request
          from pathlib import Path

          event_name = os.environ["EVENT_NAME"]
          if event_name == "issue_comment":
              lines = os.environ.get("COMMENT_BODY", "").splitlines()
              if not lines:
                  raise SystemExit("Use /jules on the first line, followed by the task prompt.")
              command = lines[0].strip()
              match = re.fullmatch(r"/jules(?:\s+--base-branch\s+(\S+))?(?:\s+run)?", command)
              if not match:
                  raise SystemExit("Use '/jules' or '/jules --base-branch <branch>' on the first line.")
              branch = match.group(1) or "develop"
              prompt = "\n".join(lines[1:]).strip()
              title = (os.environ.get("ISSUE_TITLE") or "FlexiRule task").strip()
          elif event_name == "schedule":
              branch = "develop"
              title = "Daily FlexiRule Deep Architecture, Code Quality & Frappe Compatibility Audit"
              prompt = (
                  "Daily FlexiRule Deep Architecture, Code Quality & Frappe Compatibility Audit\n\n"
                  "Perform the scheduled daily audit of FlexiRule targeting the latest develop branch. "
                  "Inspect python backend, JS/Vue frontend, RuleFlow execution, contracts, doctypes, permissions, "
                  "and tests. Compare implementations against native Frappe Framework APIs (v15/v16). "
                  "Produce an updated audit report under reports/audit/ with stable finding IDs."
              )
          else:
              prompt = os.environ.get("INPUT_PROMPT", "").strip()
              title = (os.environ.get("INPUT_TITLE") or "FlexiRule task").strip()
              branch = (os.environ.get("INPUT_BRANCH") or "develop").strip()

          if not prompt:
              raise SystemExit("The Jules prompt is empty.")
          if len(prompt) > 20000:
              raise SystemExit("The Jules prompt exceeds the 20,000-character limit.")
          if not branch or len(branch) > 255 or branch.startswith("-"):
              raise SystemExit("The base branch name is invalid.")
          try:
              subprocess.run(
                  ["git", "check-ref-format", "--branch", branch],
                  check=True, capture_output=True, text=True,
              )
          except subprocess.CalledProcessError:
              raise SystemExit("The base branch is not a valid Git branch name.")

          # Verify the requested branch exists in this repository before contacting Jules.
          owner_repo = os.environ["GITHUB_REPOSITORY"]
          encoded_branch = urllib.parse.quote(branch, safe="")
          url = f"https://api.github.com/repos/{owner_repo}/branches/{encoded_branch}"
          request = urllib.request.Request(
              url,
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          try:
              with urllib.request.urlopen(request, timeout=15) as response:
                  branch_data = json.load(response)
          except urllib.error.HTTPError as exc:
              if exc.code == 404:
                  raise SystemExit(f"Base branch '{branch}' does not exist in {owner_repo}.")
              raise SystemExit(f"Could not verify base branch (GitHub API HTTP {exc.code}).")
          except (urllib.error.URLError, TimeoutError):
              raise SystemExit("Could not verify the base branch with the GitHub API.")

          title = " ".join(title.split())[:120] or "FlexiRule task"
          payload = {
              "prompt": prompt,
              "title": title,
              "sourceContext": {
                  "source": "sources/github/Sendipad/flexirule",
                  "githubRepoContext": {"startingBranch": branch},
              },
              "automationMode": "AUTO_CREATE_PR",
              "requirePlanApproval": False,
          }
          Path("jules-request.json").write_text(
              json.dumps(payload, ensure_ascii=False),
              encoding="utf-8",
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"task_title={title}\n")
              output.write(f"base_branch={branch}\n")
          print(f"Prepared Jules request: title={title!r}, branch={branch}, prompt_chars={len(prompt)}")
          PY

      - name: Create Jules session
        id: create
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
        run: |
          if [ -z "${JULES_API_KEY:-}" ]; then
            echo "::error::The JULES_API_KEY repository secret is not configured."
            exit 1
          fi

          http_code="$(curl --silent --show-error \
            --output jules-response.json \
            --write-out '%{http_code}' \
            --request POST \
            --url 'https://jules.googleapis.com/v1alpha/sessions' \
            --header "x-goog-api-key: ${JULES_API_KEY}" \
            --header 'Content-Type: application/json' \
            --data-binary @jules-request.json)"

          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "::error::Jules API returned HTTP $http_code. Response details are omitted to avoid leaking sensitive data."
            exit 1
          fi

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          response = json.loads(Path("jules-response.json").read_text(encoding="utf-8"))
          session_id = response.get("id") or response.get("name", "").removeprefix("sessions/")
          session_url = response.get("url") or (
              f"https://jules.google.com/session/{session_id}" if session_id else ""
          )
          if not session_id:
              raise SystemExit("Jules API returned success but no session ID.")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"session_id={session_id}\n")
              output.write(f"session_url={session_url}\n")
          print(f"Jules session created: {session_id}")
          if session_url:
              print(f"Session URL: {session_url}")
          if response.get("state"):
              print(f"State: {response['state']}")
          PY

      - name: Publish handoff summary
        if: ${{ success() }}
        env:
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TASK_TITLE: ${{ steps.request.outputs.task_title }}
          BASE_BRANCH: ${{ steps.request.outputs.base_branch }}
          SESSION_URL: ${{ steps.create.outputs.session_url }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          lines = [
              "### Jules task submitted",
              "",
              f"**Task:** {os.environ['TASK_TITLE']}",
              f"**Base branch:** `{os.environ['BASE_BRANCH']}`",
              f"**Jules session:** {os.environ['SESSION_URL']}",
              f"**Workflow run:** {os.environ['RUN_URL']}",
              "",
              "Jules is configured to create a pull request automatically. Review its changes and CI before merging.",
          ]
          summary = "\n".join(lines) + "\n"
          print(summary)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as output:
              output.write(summary)
          if os.environ["EVENT_NAME"] != "issue_comment":
              raise SystemExit(0)

          repository = os.environ["REPOSITORY"]
          issue_number = os.environ["ISSUE_NUMBER"]
          if not issue_number or issue_number == "None":
              raise SystemExit(0)
          url = f"https://api.github.com/repos/{repository}/issues/{issue_number}/comments"
          request = urllib.request.Request(
              url,
              data=json.dumps({"body": "\n".join(lines)}).encode("utf-8"),
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                  "Content-Type": "application/json",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
              method="POST",
          )
          try:
              with urllib.request.urlopen(request, timeout=15) as response:
                  print(f"Published Jules handoff comment (HTTP {response.status}).")
          except (urllib.error.HTTPError, urllib.error.URLError, TimeoutError) as exc:
              # Session creation has already succeeded; don't misreport it as a failed launch.
              print(f"::warning::Jules session started, but the GitHub handoff comment could not be published: {type(exc).__name__}")
          PY
