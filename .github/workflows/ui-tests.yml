name: UI Tests

on:
  push:
    branches:
      - develop
    paths:
      - 'flexirule/public/**'
      - 'flexirule/templates/**'
      - 'flexirule/ruleflow/page/**'
      - '**/*.js'
      - '**/*.vue'
      - '**/*.ts'
      - '**/*.tsx'
      - '**/*.css'
      - '**/*.scss'
      - 'package.json'
      - 'package-lock.json'
      - 'yarn.lock'
      - 'cypress.config.js'
      - 'cypress/**'
      - 'e2e/**'
      - 'flexirule/hooks.py'
      - 'flexirule/ruleflow/api.py'
      - 'flexirule/ruleflow/api/**'
      - 'flexirule/ruleflow/core/contracts.py'
      - 'flexirule/ruleflow/core/contract_dto.py'
      - 'flexirule/ruleflow/core/contract_utils.py'
      - 'flexirule/ruleflow/core/process_contract_v2.py'
      - 'flexirule/ruleflow/core/operators.py'
      - 'flexirule/ruleflow/core/action_handlers/**'
      - 'flexirule/ruleflow/doctype/**'
      - 'flexirule/ruleflow/process/**'
      - '.github/workflows/ui-tests.yml'
  pull_request:
    branches:
      - develop
    paths:
      - 'flexirule/public/**'
      - 'flexirule/templates/**'
      - 'flexirule/ruleflow/page/**'
      - '**/*.js'
      - '**/*.vue'
      - '**/*.ts'
      - '**/*.tsx'
      - '**/*.css'
      - '**/*.scss'
      - 'package.json'
      - 'package-lock.json'
      - 'yarn.lock'
      - 'cypress.config.js'
      - 'cypress/**'
      - 'e2e/**'
      - 'flexirule/hooks.py'
      - 'flexirule/ruleflow/api.py'
      - 'flexirule/ruleflow/api/**'
      - 'flexirule/ruleflow/core/contracts.py'
      - 'flexirule/ruleflow/core/contract_dto.py'
      - 'flexirule/ruleflow/core/contract_utils.py'
      - 'flexirule/ruleflow/core/process_contract_v2.py'
      - 'flexirule/ruleflow/core/operators.py'
      - 'flexirule/ruleflow/core/action_handlers/**'
      - 'flexirule/ruleflow/doctype/**'
      - 'flexirule/ruleflow/process/**'
      - '.github/workflows/ui-tests.yml'
  workflow_dispatch:

concurrency:
  group: ui-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui-tests:
    runs-on: ubuntu-latest
    name: Cypress UI Tests

    services:
      redis-cache:
        image: redis:alpine
        ports:
          - 13000:6379
      redis-queue:
        image: redis:alpine
        ports:
          - 11000:6379
      mariadb:
        image: mariadb:10.6
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mariadb-admin ping" --health-interval=5s --health-timeout=2s --health-retries=3

    steps:
      - name: Clone
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          check-latest: true

      - name: Add to Hosts
        run: echo "127.0.0.1 test_site" | sudo tee -a /etc/hosts

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/*requirements.txt', '**/pyproject.toml', '**/setup.py', '**/setup.cfg') }}
          restore-keys: |
            ${{ runner.os }}-pip-
            ${{ runner.os }}-

      - name: Get yarn cache directory path
        id: yarn-cache-dir-path
        run: echo "dir=$(yarn cache dir)" >> $GITHUB_OUTPUT

      - name: Cache yarn
        uses: actions/cache@v4
        id: yarn-cache
        with:
          path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
          key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-yarn-

      - name: Cache Cypress binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/Cypress
          key: ${{ runner.os }}-cypress-${{ hashFiles('**/package-lock.json', '**/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-cypress-

      - name: Install MariaDB Client
        run: sudo apt-get update && sudo apt-get install -y mariadb-client

      - name: Setup Frappe Bench
        run: |
          pip install frappe-bench
          bench init --frappe-branch version-15 --skip-redis-config-generation --skip-assets --python "$(which python)" ~/frappe-bench
          mariadb --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL character_set_server = 'utf8mb4'"
          mariadb --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL collation_server = 'utf8mb4_unicode_ci'"

      - name: Install App & Site
        working-directory: /home/runner/frappe-bench
        run: |
          bench get-app flexirule $GITHUB_WORKSPACE
          bench setup requirements --dev
          bench new-site --db-root-password root --admin-password admin test_site
          bench --site test_site install-app flexirule
          bench --site test_site set-config allow_tests true
          bench use test_site
          bench --site test_site execute frappe.utils.install.complete_setup_wizard
          bench --site test_site execute frappe.tests.ui_test_helpers.create_test_user
          bench --site test_site set-admin-password admin
        env:
          CI: "Yes"

      - name: Prepare Cypress Environment
        run: |
          mkdir -p $(dirname $GITHUB_WORKSPACE)
          ln -s /home/runner/frappe-bench/apps/frappe $(dirname $GITHUB_WORKSPACE)/frappe
          cd /home/runner/frappe-bench/apps/frappe && yarn install
          cd $GITHUB_WORKSPACE && yarn install

      - name: Build Frontend Assets
        working-directory: /home/runner/frappe-bench
        run: bench build --app flexirule
        env:
          CI: "Yes"

      - name: Start Bench Server & Run UI Tests
        working-directory: /home/runner/frappe-bench
        run: |
          sed -i 's/^watch:/# watch:/g' Procfile
          sed -i 's/^schedule:/# schedule:/g' Procfile
          bench start &> /home/runner/frappe-bench/bench_start.log &
          timeout 60 bash -c 'until curl -s http://127.0.0.1:8000 > /dev/null; do sleep 2; done'
          bench --site test_site run-ui-tests flexirule --headless
        env:
          CI: "Yes"

      - name: Show Bench Server Output on Failure
        if: failure()
        run: cat /home/runner/frappe-bench/bench_start.log || true

      - name: Upload Test Artifacts on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-test-artifacts
          path: |
            /home/runner/frappe-bench/apps/flexirule/cypress/screenshots
            /home/runner/frappe-bench/apps/flexirule/cypress/videos
            /home/runner/work/flexirule/flexirule/cypress/screenshots
            /home/runner/work/flexirule/flexirule/cypress/videos
          if-no-files-found: ignore
