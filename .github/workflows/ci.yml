name: CI

on:
  push:
    branches: [develop]
    paths-ignore:
      - "docs/**"
      - "docs-config/**"
      - "landing-page/**"
      - "architecture/**"
      - "*.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "docs-config/**"
      - "landing-page/**"
      - "architecture/**"
      - "*.md"
  workflow_dispatch:

concurrency:
  group: flexirule-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.10"
  NODE_VERSION: "18"
  BENCH_DIR: /home/runner/frappe-bench
  SITE: test_site

jobs:
  frontend-build:
    name: Frontend build + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
      - name: Install Bench
        run: pip install "frappe-bench>=5,<6"
      - name: Initialize Frappe v15 Bench
        run: bench init --frappe-branch version-15 --skip-redis-config-generation --skip-assets --python "$(which python)" "$BENCH_DIR"
      - name: Link FlexiRule working tree into Bench
        working-directory: ${{ env.BENCH_DIR }}
        run: |
          rm -rf apps/flexirule
          ln -s "$GITHUB_WORKSPACE" apps/flexirule
          bench setup requirements --dev
      - name: Install frontend dependencies
        working-directory: ${{ env.BENCH_DIR }}
        run: yarn --cwd apps/flexirule install --frozen-lockfile
      - name: Lint
        working-directory: ${{ env.BENCH_DIR }}
        run: yarn --cwd apps/flexirule lint
      - name: Build
        working-directory: ${{ env.BENCH_DIR }}
        env:
          CI: "1"
        run: bench build --app flexirule

  backend:
    name: Frappe v15 + ERPNext v15 backend
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.6
        env:
          MYSQL_ROOT_PASSWORD: root
          MARIADB_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s --health-timeout=3s --health-retries=30
      redis-cache:
        image: redis:7-alpine
        ports: ["13000:6379"]
      redis-queue:
        image: redis:7-alpine
        ports: ["11000:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
      - name: Install MariaDB client
        run: |
          sudo apt-get update
          sudo apt-get install -y mariadb-client
      - name: Install Bench
        run: pip install "frappe-bench>=5,<6"
      - name: Initialize Frappe v15 Bench
        run: |
          bench init --frappe-branch version-15 --skip-redis-config-generation --skip-assets --python "$(which python)" "$BENCH_DIR"
          cd "$BENCH_DIR"
          bench set-config -g db_host 127.0.0.1
          bench set-config -g db_port 3306
          bench set-config -g redis_cache redis://127.0.0.1:13000
          bench set-config -g redis_queue redis://127.0.0.1:11000
          bench set-config -g redis_socketio redis://127.0.0.1:11000
      - name: Install ERPNext v15 and FlexiRule
        working-directory: ${{ env.BENCH_DIR }}
        env:
          CI: "1"
        run: |
          bench get-app --branch version-15 erpnext https://github.com/frappe/erpnext.git
          rm -rf apps/flexirule
          ln -s "$GITHUB_WORKSPACE" apps/flexirule
          bench setup requirements --dev
      - name: Create test_site
        working-directory: ${{ env.BENCH_DIR }}
        run: |
          bench new-site "$SITE" --db-root-password root --admin-password admin --db-host 127.0.0.1 --db-port 3306 --install-app erpnext
          bench --site "$SITE" install-app flexirule
          bench --site "$SITE" migrate
          bench --site "$SITE" set-config allow_tests true
      - name: Run backend tests
        working-directory: ${{ env.BENCH_DIR }}
        env:
          TYPE: server
        run: bench --site "$SITE" run-tests --app flexirule
      - name: Verify migration is repeatable
        working-directory: ${{ env.BENCH_DIR }}
        run: bench --site "$SITE" migrate

  ui:
    name: Cypress UI tests
    needs: backend
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.6
        env:
          MYSQL_ROOT_PASSWORD: root
          MARIADB_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s --health-timeout=3s --health-retries=30
      redis-cache:
        image: redis:7-alpine
        ports: ["13000:6379"]
      redis-queue:
        image: redis:7-alpine
        ports: ["11000:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: yarn
      - name: Install MariaDB client
        run: |
          sudo apt-get update
          sudo apt-get install -y mariadb-client
      - name: Install Bench
        run: pip install "frappe-bench>=5,<6"
      - name: Initialize bench and install apps
        run: |
          bench init --frappe-branch version-15 --skip-redis-config-generation --skip-assets --python "$(which python)" "$BENCH_DIR"
          cd "$BENCH_DIR"
          bench set-config -g db_host 127.0.0.1
          bench set-config -g db_port 3306
          bench set-config -g redis_cache redis://127.0.0.1:13000
          bench set-config -g redis_queue redis://127.0.0.1:11000
          bench set-config -g redis_socketio redis://127.0.0.1:11000
          bench get-app --branch version-15 erpnext https://github.com/frappe/erpnext.git
          rm -rf apps/flexirule
          ln -s "$GITHUB_WORKSPACE" apps/flexirule
          bench setup requirements --dev
          bench new-site "$SITE" --db-root-password root --admin-password admin --db-host 127.0.0.1 --db-port 3306 --install-app erpnext
          bench --site "$SITE" install-app flexirule
          bench --site "$SITE" migrate
      - name: Build assets
        working-directory: ${{ env.BENCH_DIR }}
        run: bench build --app flexirule
      - name: Start bench
        working-directory: ${{ env.BENCH_DIR }}
        run: |
          nohup bench start > /tmp/bench.log 2>&1 &
          timeout 90 bash -c 'until curl -fsS http://127.0.0.1:8000/api/method/frappe.ping; do sleep 2; done'
      - name: Run UI tests
        working-directory: ${{ env.BENCH_DIR }}
        run: bench --site "$SITE" run-ui-tests flexirule --headless
