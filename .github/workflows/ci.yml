name: CI

on:
    push:
        branches:
            - develop
        paths-ignore:
            - "docs/**"
            - "docs-config/**"
            - "landing-page/**"
            - "architecture/**"
            - "*.md"
    pull_request:
        paths-ignore:
            - "docs/**"
            - "docs-config/**"
            - "landing-page/**"
            - "architecture/**"
            - "*.md"
    workflow_dispatch:

concurrency:
    group: develop-flexirule-${{ github.event.number }}
    cancel-in-progress: true

jobs:
    changes:
        runs-on: ubuntu-latest
        outputs:
            frontend: ${{ steps.filter.outputs.frontend }}
            backend: ${{ steps.filter.outputs.backend }}
        steps:
            - name: Clone
              uses: actions/checkout@v4

            - uses: dorny/paths-filter@v3
              id: filter
              with:
                  filters: |
                      frontend:
                        - 'flexirule/public/**'
                        - 'flexirule/templates/**'
                        - '**/*.js'
                        - '**/*.vue'
                        - '**/*.css'
                        - '**/*.scss'
                        - 'package.json'
                        - 'package-lock.json'
                        - 'yarn.lock'
                        - 'requirements.txt'
                        - 'pyproject.toml'
                        - '.github/workflows/**'
                        - '.eslintrc'
                        - '.prettierrc'
                        - '.pre-commit-config.yaml'
                      backend:
                        - '**/*.py'
                        - 'flexirule/**/*.json'
                        - 'requirements.txt'
                        - 'pyproject.toml'
                        - 'package.json'
                        - 'package-lock.json'
                        - 'yarn.lock'
                        - '.github/workflows/**'

    build:
        needs: changes
        if: ${{ needs.changes.outputs.frontend == 'true' }}
        runs-on: ubuntu-latest
        name: Frontend

        steps:
            - name: Clone
              uses: actions/checkout@v4

            - name: Setup Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.10"

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 18
                  check-latest: true

            - name: Cache pip
              uses: actions/cache@v4
              with:
                  path: ~/.cache/pip
                  key: ${{ runner.os }}-pip-${{ hashFiles('**/*requirements.txt', '**/pyproject.toml', '**/setup.py', '**/setup.cfg') }}
                  restore-keys: |
                      ${{ runner.os }}-pip-
                      ${{ runner.os }}-

            - name: Get yarn cache directory path
              id: yarn-cache-dir-path
              run: 'echo "dir=$(yarn cache dir)" >> $GITHUB_OUTPUT'

            - uses: actions/cache@v4
              id: yarn-cache
              with:
                  path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
                  key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-yarn-

            - name: Lint
              working-directory: ${{ github.workspace }}
              run: |
                  npm install
                  npm run lint

            - name: Setup Bench
              run: |
                  pip install frappe-bench
                  bench init --frappe-branch version-15 --skip-redis-config-generation --skip-assets --python "$(which python)" ~/frappe-bench

            - name: Install App
              working-directory: /home/runner/frappe-bench
              run: |
                  bench get-app flexirule $GITHUB_WORKSPACE
                  bench setup requirements --dev
              env:
                  CI: "Yes"

            - name: Build
              working-directory: /home/runner/frappe-bench
              run: |
                  set -o pipefail
                  # Fail early if there are unimported components or syntax errors in Vue files
                  CI=Yes bench build --app flexirule --production 2>&1 | tee build_output.log

                  # Check for esbuild errors which bench might swallow
                  if grep -qiE "error:|Build failed|Aborted" build_output.log; then
                    echo "::error::Critical build error detected in logs!"
                    exit 1
                  fi
              env:
                  CI: "Yes"

    tests:
        needs: changes
        if: ${{ needs.changes.outputs.backend == 'true' }}
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
        name: Server

        services:
            redis-cache:
                image: redis:alpine
                ports:
                    - 13000:6379
            redis-queue:
                image: redis:alpine
                ports:
                    - 11000:6379
            mariadb:
                image: mariadb:10.6
                env:
                    MYSQL_ROOT_PASSWORD: root
                ports:
                    - 3306:3306
                options: --health-cmd="mariadb-admin ping" --health-interval=5s --health-timeout=2s --health-retries=3

        steps:
            - name: Clone
              uses: actions/checkout@v4

            - name: Find tests
              run: |
                  echo "Finding tests"
                  grep -rn "def test" > /dev/null

            - name: Setup Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.10"

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 18
                  check-latest: true

            - name: Cache pip
              uses: actions/cache@v4
              with:
                  path: ~/.cache/pip
                  key: ${{ runner.os }}-pip-${{ hashFiles('**/*requirements.txt', '**/pyproject.toml', '**/setup.py', '**/setup.cfg') }}
                  restore-keys: |
                      ${{ runner.os }}-pip-
                      ${{ runner.os }}-

            - name: Get yarn cache directory path
              id: yarn-cache-dir-path
              run: 'echo "dir=$(yarn cache dir)" >> $GITHUB_OUTPUT'

            - uses: actions/cache@v4
              id: yarn-cache
              with:
                  path: ${{ steps.yarn-cache-dir-path.outputs.dir }}
                  key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-yarn-

            - name: Install MariaDB Client
              run: sudo apt-get install mariadb-client

            - name: Setup
              run: |
                  pip install frappe-bench
                  bench init --frappe-branch version-15 --skip-redis-config-generation --skip-assets --python "$(which python)" ~/frappe-bench
                  mariadb --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL character_set_server = 'utf8mb4'"
                  mariadb --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL collation_server = 'utf8mb4_unicode_ci'"

            - name: Install
              working-directory: /home/runner/frappe-bench
              run: |
                  bench get-app flexirule $GITHUB_WORKSPACE
                  bench setup requirements --dev
                  bench new-site --db-root-password root --admin-password admin test_site
                  bench --site test_site install-app flexirule
              env:
                  CI: "Yes"

            - name: Run Tests
              working-directory: /home/runner/frappe-bench
              run: |
                  bench --site test_site set-config allow_tests true
                  bench --site test_site run-tests --app flexirule
              env:
                  TYPE: server
