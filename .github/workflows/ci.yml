name: CI

on:
  push:
    branches:
      - develop
    paths-ignore:
      - "docs/**"
      - "docs-config/**"
      - "landing-page/**"
      - "architecture/**"
      - "*.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "docs-config/**"
      - "landing-page/**"
      - "architecture/**"
      - "*.md"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

# Keep only the newest run for a given PR or branch. Do not let unrelated
# branch pushes cancel each other because pull_request.number is unavailable on push.
concurrency:
  group: flexirule-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.frontend }}
      backend: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.backend }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect changed areas
        if: ${{ github.event_name != 'workflow_dispatch' }}
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'flexirule/public/**'
              - 'flexirule/templates/**'
              - '**/*.js'
              - '**/*.vue'
              - '**/*.css'
              - '**/*.scss'
              - 'package.json'
              - 'package-lock.json'
              - 'yarn.lock'
              - 'requirements.txt'
              - 'pyproject.toml'
              - '.github/workflows/**'
            backend:
              - '**/*.py'
              - 'flexirule/**/*.json'
              - 'requirements.txt'
              - 'pyproject.toml'
              - '.github/workflows/**'
              - 'package.json'
              - 'package-lock.json'
              - 'yarn.lock'

  build:
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    name: Frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout Frappe 15 source
        uses: actions/checkout@v4
        with:
          repository: frappe/frappe
          ref: version-15
          path: frappe-src
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml
            frappe-src/pyproject.toml

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Test layout request queue
        run: yarn test:layout-queue

      - name: Setup Bench
        run: |
          python -m pip install frappe-bench
          bench init --skip-redis-config-generation --skip-assets --python "$(which python)" --frappe-path "$GITHUB_WORKSPACE/frappe-src" ~/frappe-bench

      - name: Install app and requirements
        working-directory: /home/runner/frappe-bench
        run: |
          bench get-app flexirule "$GITHUB_WORKSPACE"
          bench setup requirements --dev
        env:
          CI: "Yes"

      - name: Build
        working-directory: /home/runner/frappe-bench
        run: |
          set -o pipefail
          bench build --app flexirule --production 2>&1 | tee build_output.log
        env:
          CI: "Yes"

      - name: Validate frontend sources
        working-directory: /home/runner/frappe-bench/apps/flexirule
        run: npx --no-install eslint flexirule/public/js

      - name: Run inline presentation unit tests
        working-directory: /home/runner/frappe-bench/apps/flexirule
        run: yarn test:inline-presentation

  tests:
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    name: Server (Frappe 15)

    services:
      redis-cache:
        image: redis:7-alpine
        ports:
          - 13000:6379
      redis-queue:
        image: redis:7-alpine
        ports:
          - 11000:6379
      mariadb:
        image: mariadb:10.6.24
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mariadb-admin ping" --health-interval=5s --health-timeout=2s --health-retries=3

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout Frappe 15 source
        uses: actions/checkout@v4
        with:
          repository: frappe/frappe
          ref: version-15
          path: frappe-src
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml
            frappe-src/pyproject.toml

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install MariaDB client when missing
        run: |
          if ! command -v mariadb >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y mariadb-client
          else
            echo "MariaDB client is already available; skipping package installation."
          fi
          sudo mkdir -p /etc/mysql/conf.d
          printf '[client]
ssl=0
skip-ssl
' | sudo tee /etc/mysql/conf.d/skip-ssl.cnf > /dev/null

      - name: Initialize Bench and database
        run: |
          python -m pip install frappe-bench
          bench init --skip-redis-config-generation --skip-assets --python "$(which python)" --frappe-path "$GITHUB_WORKSPACE/frappe-src" ~/frappe-bench
          mariadb --skip-ssl --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL character_set_server = 'utf8mb4'"
          mariadb --skip-ssl --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL collation_server = 'utf8mb4_unicode_ci'"

      - name: Install app and create test site
        working-directory: /home/runner/frappe-bench
        run: |
          bench get-app flexirule "$GITHUB_WORKSPACE"
          bench setup requirements --dev
          bench new-site --db-root-password root --admin-password admin test_site
          bench --site test_site install-app flexirule
        env:
          CI: "Yes"

      - name: Validate app and test package discovery
        working-directory: /home/runner/frappe-bench
        run: |
          bench --site test_site execute frappe.get_installed_apps
          ./env/bin/python - <<'PY'
          import importlib.util
          from pathlib import Path

          app_spec = importlib.util.find_spec("flexirule")
          if app_spec is None or app_spec.origin is None:
              raise SystemExit("FlexiRule Python package is not importable")

          app_path = Path(app_spec.origin).parent
          test_dirs = sorted(app_path.rglob("tests"))
          if not test_dirs:
              raise SystemExit(f"No tests directories found under {app_path}")

          print(f"FlexiRule package: {app_path}")
          print("Test directories:")
          for test_dir in test_dirs:
              print(f" - {test_dir.relative_to(app_path)}")
          PY

      - name: Migrate test site
        working-directory: /home/runner/frappe-bench
        run: bench --site test_site migrate
        env:
          TYPE: server

      - name: Run tests
        working-directory: /home/runner/frappe-bench
        run: |
          bench --site test_site set-config allow_tests true
          # FlexiRule's tests are distributed across feature packages rather
          # than a single flexirule.tests package; use Frappe's serial app runner.
          bench --site test_site run-tests --app flexirule
        env:
          TYPE: server


  tests_frappe_16_nested_set:
    needs: changes
    # Frappe 16 compatibility is an opt-in validation run, not a required PR/push check.
    if: ${{ github.event_name == 'workflow_dispatch' && needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    name: Nested-set integration (Frappe 16)

    services:
      redis-cache:
        image: redis:7-alpine
        ports:
          - 13000:6379
      redis-queue:
        image: redis:7-alpine
        ports:
          - 11000:6379
      mariadb:
        image: mariadb:11.8
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mariadb-admin ping" --health-interval=5s --health-timeout=2s --health-retries=3

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout Frappe 16 source
        uses: actions/checkout@v4
        with:
          repository: frappe/frappe
          ref: version-16
          path: frappe-src
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml
            frappe-src/pyproject.toml

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install MariaDB client when missing
        run: |
          if ! command -v mariadb >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y mariadb-client
          else
            echo "MariaDB client is already available; skipping package installation."
          fi
          sudo mkdir -p /etc/mysql/conf.d
          printf '[client]
ssl=0
skip-ssl
' | sudo tee /etc/mysql/conf.d/skip-ssl.cnf > /dev/null

      - name: Initialize Bench and database
        run: |
          python -m pip install frappe-bench
          bench init --skip-redis-config-generation --skip-assets --python "$(which python)" --frappe-path "$GITHUB_WORKSPACE/frappe-src" ~/frappe-bench
          mariadb --skip-ssl --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL character_set_server = 'utf8mb4'"
          mariadb --skip-ssl --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL collation_server = 'utf8mb4_unicode_ci'"

      - name: Install app and create test site
        working-directory: /home/runner/frappe-bench
        run: |
          bench get-app flexirule "$GITHUB_WORKSPACE"
          bench setup requirements --dev
          bench new-site --db-root-password root --admin-password admin test_site
          bench --site test_site install-app flexirule
        env:
          CI: "Yes"

      - name: Run nested-set integration tests
        working-directory: /home/runner/frappe-bench
        run: |
          bench --site test_site set-config allow_tests true
          bench --site test_site run-tests --module flexirule.ruleflow.tests.test_fetch_records_tree_operators
        env:
          TYPE: server
