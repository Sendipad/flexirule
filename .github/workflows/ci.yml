name: CI

on:
  push:
    branches:
      - develop
    paths-ignore:
      - "docs/**"
      - "docs-config/**"
      - "landing-page/**"
      - "architecture/**"
      - "*.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "docs-config/**"
      - "landing-page/**"
      - "architecture/**"
      - "*.md"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

# Keep only the newest run for a given PR or branch. Do not let unrelated
# branch pushes cancel each other because pull_request.number is unavailable on push.
concurrency:
  group: flexirule-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.frontend }}
      backend: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.backend }}
      condition_runtime: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.condition_runtime }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect changed areas
        if: ${{ github.event_name != 'workflow_dispatch' }}
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'flexirule/public/**'
              - 'flexirule/templates/**'
              - '**/*.js'
              - '**/*.vue'
              - '**/*.css'
              - '**/*.scss'
              - 'package.json'
              - 'package-lock.json'
              - 'yarn.lock'
              - 'requirements.txt'
              - 'pyproject.toml'
              - '.github/workflows/**'
            backend:
              - '**/*.py'
              - 'flexirule/**/*.json'
              - 'requirements.txt'
              - 'pyproject.toml'
              - '.github/workflows/**'
              - 'package.json'
              - 'package-lock.json'
              - 'yarn.lock'
            condition_runtime:
              - 'flexirule/ruleflow/core/condition_*.py'
              - 'flexirule/ruleflow/core/flexvalue_contract.py'
              - 'flexirule/ruleflow/core/value_resolver.py'
              - 'flexirule/ruleflow/core/action_handlers/condition.py'
              - 'flexirule/ruleflow/core/action_handlers/assignment.py'
              - 'flexirule/ruleflow/core/engine.py'
              - 'flexirule/ruleflow/tests/test_canonical_condition_evaluator.py'
              - 'flexirule/ruleflow/tests/condition_benchmark/**'
              - '.github/workflows/ci.yml'

  build:
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    name: Frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout Frappe 15 source
        uses: actions/checkout@v4
        with:
          repository: frappe/frappe
          ref: version-15
          path: frappe-src
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml
            frappe-src/pyproject.toml

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Test layout request queue
        run: yarn test:layout-queue

      - name: Setup Bench
        run: |
          python -m pip install frappe-bench
          bench init --skip-redis-config-generation --skip-assets --python "$(which python)" --frappe-path "$GITHUB_WORKSPACE/frappe-src" ~/frappe-bench

      - name: Install app and requirements
        working-directory: /home/runner/frappe-bench
        run: |
          bench get-app flexirule "$GITHUB_WORKSPACE"
          bench setup requirements --dev
        env:
          CI: "Yes"

      - name: Build
        working-directory: /home/runner/frappe-bench
        run: |
          set -o pipefail
          bench build --app flexirule --production 2>&1 | tee build_output.log
        env:
          CI: "Yes"

      - name: Validate frontend sources
        working-directory: /home/runner/frappe-bench/apps/flexirule
        run: npx --no-install eslint flexirule/public/js

      - name: Run inline presentation unit tests
        working-directory: /home/runner/frappe-bench/apps/flexirule
        run: yarn test:inline-presentation

  tests:
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    name: Server (Frappe 15)

    services:
      redis-cache:
        image: redis:7-alpine
        ports:
          - 13000:6379
      redis-queue:
        image: redis:7-alpine
        ports:
          - 11000:6379
      mariadb:
        image: mariadb:10.6.24
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mariadb-admin ping" --health-interval=5s --health-timeout=2s --health-retries=3

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare CI diagnostic directories
        run: |
          rm -rf /tmp/flexirule-ci-reports
          mkdir -p /tmp/flexirule-ci-reports/test-results /tmp/flexirule-ci-reports/condition-runtime

      - name: Checkout Frappe 15 source
        uses: actions/checkout@v4
        with:
          repository: frappe/frappe
          ref: version-15
          path: frappe-src
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml
            frappe-src/pyproject.toml

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install MariaDB client when missing
        run: |
          if ! command -v mariadb >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y mariadb-client
          else
            echo "MariaDB client is already available; skipping package installation."
          fi
          sudo mkdir -p /etc/mysql/conf.d
          echo -e "[client]\nskip-ssl" | sudo tee /etc/mysql/conf.d/disable-ssl.cnf

      - name: Initialize Bench and database
        run: |
          python -m pip install frappe-bench
          bench init --skip-redis-config-generation --skip-assets --python "$(which python)" --frappe-path "$GITHUB_WORKSPACE/frappe-src" ~/frappe-bench
          mariadb --skip-ssl --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL character_set_server = 'utf8mb4'"
          mariadb --skip-ssl --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL collation_server = 'utf8mb4_unicode_ci'"

      - name: Install app and create test site
        working-directory: /home/runner/frappe-bench
        run: |
          bench get-app flexirule "$GITHUB_WORKSPACE"
          bench setup requirements --dev
          bench new-site --db-root-password root --admin-password admin test_site
          bench --site test_site install-app flexirule
        env:
          CI: "Yes"

      - name: Validate app and test package discovery
        working-directory: /home/runner/frappe-bench
        run: |
          bench --site test_site execute frappe.get_installed_apps
          ./env/bin/python - <<'PY'
          import importlib.util
          from pathlib import Path

          app_spec = importlib.util.find_spec("flexirule")
          if app_spec is None or app_spec.origin is None:
              raise SystemExit("FlexiRule Python package is not importable")

          app_path = Path(app_spec.origin).parent
          test_dirs = sorted(app_path.rglob("tests"))
          if not test_dirs:
              raise SystemExit(f"No tests directories found under {app_path}")

          print(f"FlexiRule package: {app_path}")
          print("Test directories:")
          for test_dir in test_dirs:
              print(f" - {test_dir.relative_to(app_path)}")
          PY

      - name: Migrate test site
        id: migrate_test_site
        working-directory: /home/runner/frappe-bench
        run: bench --site test_site migrate
        env:
          TYPE: server

      - name: Run tests (capture JUnit XML and full log)
        id: run_tests
        working-directory: /home/runner/frappe-bench
        run: |
          set -euo pipefail
          bench --site test_site set-config allow_tests true
          # Keep the original test exit code while report generation continues.
          set +e
          bench --site test_site run-tests --app flexirule \
            --junit-xml-output /tmp/flexirule-ci-reports/test-results/server-tests.xml \
            2>&1 | tee /tmp/flexirule-ci-reports/test-results/server-tests.log
          test_exit_code=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$test_exit_code" > /tmp/flexirule-ci-reports/test-results/server-tests.exitcode
          echo "exit_code=$test_exit_code" >> "$GITHUB_OUTPUT"
        env:
          TYPE: server


      - name: Run condition runtime benchmark
        id: condition_benchmark
        if: ${{ always() && needs.changes.outputs.condition_runtime == 'true' && steps.migrate_test_site.outcome == 'success' }}
        working-directory: ${{ github.workspace }}
        env:
          CI: "Yes"
          FRAPPE_SITE_NAME: test_site
          FRAPPE_BENCH_PATH: /home/runner/frappe-bench
          CONDITION_BENCHMARK_JSON_PATH: /tmp/flexirule-ci-reports/condition-runtime/canonical_condition_benchmark_results.json
          CONDITION_BENCHMARK_MARKDOWN_PATH: /tmp/flexirule-ci-reports/condition-runtime/condition-backend-comparison-benchmark.md
        run: |
          set -euo pipefail
          set +e
          /home/runner/frappe-bench/env/bin/python \
            "$GITHUB_WORKSPACE/flexirule/ruleflow/tests/condition_benchmark/benchmark_runner.py" \
            2>&1 | tee /tmp/flexirule-ci-reports/condition-runtime/benchmark.log
          benchmark_exit_code=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$benchmark_exit_code" > /tmp/flexirule-ci-reports/condition-runtime/benchmark.exitcode
          # Defer failure to the final gate so the log and any generated reports upload first.

      - name: Summarize backend tests and condition benchmark
        if: always()
        env:
          CONDITION_RUNTIME_ENABLED: ${{ needs.changes.outputs.condition_runtime }}
          TEST_STEP_OUTCOME: ${{ steps.run_tests.outcome }}
          BENCHMARK_STEP_OUTCOME: ${{ steps.condition_benchmark.outcome }}
          MIGRATE_STEP_OUTCOME: ${{ steps.migrate_test_site.outcome }}
          EXPECTED_BENCHMARK_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/artifacts/ci-reports"
          if [ -d /tmp/flexirule-ci-reports ]; then
            cp -a /tmp/flexirule-ci-reports/. "$GITHUB_WORKSPACE/artifacts/ci-reports/"
          fi
          python - <<'PY'
          import html
          import json
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          root = Path(os.environ["GITHUB_WORKSPACE"]) / "artifacts" / "ci-reports"
          lines = ["## FlexiRule backend test and condition benchmark report", ""]
          issues = []
          test_dir = root / "test-results"
          test_outcome = os.environ.get("TEST_STEP_OUTCOME", "unknown")
          junit_file = test_dir / "server-tests.xml"
          exit_file = test_dir / "server-tests.exitcode"
          lines.extend(["### Backend tests", ""])
          if junit_file.exists():
              try:
                  junit = ET.parse(junit_file).getroot()
                  cases = junit.findall(".//testcase")
                  failures, errors, skipped = [], [], 0
                  for case in cases:
                      for item in list(case):
                          if item.tag == "failure":
                              failures.append((case, item))
                          elif item.tag == "error":
                              errors.append((case, item))
                          elif item.tag == "skipped":
                              skipped += 1
                  passed = max(0, len(cases) - len(failures) - len(errors) - skipped)
                  lines.append(f"- JUnit totals: {passed} passed, {len(failures)} failures, {len(errors)} errors, {skipped} skipped; {len(cases)} cases.")
                  for label, records in (("Failure", failures), ("Error", errors)):
                      for case, item in records[:10]:
                          name = f"{case.attrib.get('classname', '')}.{case.attrib.get('name', 'unknown')}".strip(".")
                          detail = (item.text or item.attrib.get("message") or "No traceback provided").strip()[:8000]
                          lines.extend(["", f"<details><summary>{html.escape(label + ': ' + name)}</summary>", "", "<pre>", html.escape(detail), "</pre>", "", "</details>"])
                  if failures or errors:
                      issues.append(f"Frappe tests had {len(failures)} failure(s) and {len(errors)} error(s).")
              except (ET.ParseError, OSError) as exc:
                  lines.append(f"- JUnit XML parse failed: {exc}")
                  issues.append("The JUnit XML report is invalid.")
          else:
              lines.append("- JUnit XML was not produced.")
              if test_outcome != "success":
                  issues.append(f"The Frappe test command did not complete (step outcome: {test_outcome}).")
              else:
                  issues.append("The Frappe test command completed without producing the configured JUnit XML report.")
          if exit_file.exists():
              code = int(exit_file.read_text().strip())
              lines.append(f"- Original Frappe test command exit code: {code}.")
              if code:
                  issues.append(f"The Frappe test command exited with code {code}.")
          elif test_outcome == "success":
              issues.append("The Frappe test command exit-code record is missing.")

          enabled = os.environ.get("CONDITION_RUNTIME_ENABLED") == "true"
          benchmark_outcome = os.environ.get("BENCHMARK_STEP_OUTCOME", "unknown")
          migrate_outcome = os.environ.get("MIGRATE_STEP_OUTCOME", "unknown")
          bench_dir = root / "condition-runtime"
          bench_exit = bench_dir / "benchmark.exitcode"
          json_report = bench_dir / "canonical_condition_benchmark_results.json"
          markdown_report = bench_dir / "condition-backend-comparison-benchmark.md"
          lines.extend(["", "### Condition runtime benchmark", ""])
          if not enabled:
              lines.append("- Not run: condition-runtime files were not part of this change.")
          elif migrate_outcome != "success":
              lines.append("- Not run because the Frappe test site did not migrate successfully.")
          elif benchmark_outcome != "success":
              lines.append(f"- Benchmark step did not complete (step outcome: {benchmark_outcome}).")
              issues.append("The condition benchmark step did not complete.")
          else:
              if bench_exit.exists():
                  code = int(bench_exit.read_text().strip())
                  lines.append(f"- Benchmark command exit code: {code}.")
                  if code:
                      issues.append(f"The condition benchmark exited with code {code}.")
              else:
                  issues.append("The condition benchmark exit-code record is missing.")
              if not json_report.exists():
                  lines.append("- JSON benchmark report was not produced.")
                  issues.append("The JSON benchmark report is missing.")
              else:
                  try:
                      payload = json.loads(json_report.read_text(encoding="utf-8"))
                      correctness = payload.get("correctness_suite", {})
                      passed = correctness.get("total_supported_correct", 0)
                      supported = correctness.get("total_supported_scenarios", 0)
                      lines.append(f"- Supported semantic scenarios: {passed}/{supported} correct.")
                      env = payload.get("environment", {})
                      source_commit = env.get("benchmark_source_commit", "unknown")
                      expected_commit = os.environ.get("EXPECTED_BENCHMARK_COMMIT", "")
                      dirty = bool(env.get("is_working_tree_dirty", True))
                      lines.append(f"- Benchmark source commit: {source_commit}.")
                      lines.append(f"- Expected workflow commit: {expected_commit}.")
                      lines.append(f"- Working tree dirty: {dirty}.")
                      if expected_commit and source_commit != expected_commit:
                          issues.append("Benchmark provenance commit does not match the workflow head SHA.")
                      if dirty:
                          issues.append("Benchmark ran with a dirty working tree; its timing report is not accepted.")
                      if not correctness.get("all_supported_correct", False):
                          issues.append("At least one supported benchmark scenario failed semantic correctness.")
                      public_key = "Canonical Condition (evaluate_condition)"
                      prepared_key = "Canonical Condition (Prepared Artifact Runtime)"
                      scenarios = payload.get("steady_state_benchmark", {}).get("scenarios", [])
                      lines.extend(["", "| Scenario | Public runtime (microseconds/op) | Prepared artifact (microseconds/op) |", "|---|---:|---:|"])
                      for scenario in scenarios:
                          sid = scenario.get("scenario_id", "unknown")
                          metrics = scenario.get("candidate_metrics", {})
                          public = metrics.get(public_key, {})
                          prepared = metrics.get(prepared_key, {})
                          if sid != "edge_case_has_changed" and not prepared.get("is_valid_measurement", False):
                              issues.append(f"Prepared-artifact measurement invalid for scenario {sid}.")
                          public_value = public.get("median_us_per_exec", "unsupported") if public.get("is_valid_measurement") else "unsupported"
                          prepared_value = prepared.get("median_us_per_exec", "unsupported") if prepared.get("is_valid_measurement") else "unsupported"
                          lines.append(f"| {sid} | {public_value} | {prepared_value} |")
                      if markdown_report.exists():
                          lines.extend(["", "Full Markdown report, raw JSON, and benchmark log are in the uploaded artifact."])
                  except (json.JSONDecodeError, OSError, TypeError) as exc:
                      lines.append(f"- Could not read benchmark JSON: {exc}")
                      issues.append("The benchmark JSON report is invalid.")

          if issues:
              lines.extend(["", "### Problems detected", ""] + [f"- {issue}" for issue in issues])
              (root / "ci-summary-failed").write_text("\n".join(issues) + "\n", encoding="utf-8")
          else:
              (root / "ci-summary-passed").write_text("All executed report checks passed.\n", encoding="utf-8")
              lines.extend(["", "No report-detected test or benchmark failures."])
          target = Path(os.environ["GITHUB_STEP_SUMMARY"])
          target.write_text("\n".join(lines) + "\n", encoding="utf-8")
          print("\n".join(lines))
          PY

      - name: Upload backend test and condition benchmark reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-condition-reports-${{ github.run_id }}
          path: artifacts/ci-reports/
          if-no-files-found: warn
          retention-days: 14

      - name: Fail job if tests or benchmark validation failed
        if: always()
        run: |
          if [ -f "$GITHUB_WORKSPACE/artifacts/ci-reports/ci-summary-failed" ]; then
            echo "Frappe tests or benchmark validation failed. See the step summary and uploaded backend-test-condition-reports artifact."
            exit 1
          fi

  tests_frappe_16_nested_set:
    needs: changes
    # Frappe 16 compatibility is an opt-in validation run, not a required PR/push check.
    if: ${{ github.event_name == 'workflow_dispatch' && needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    name: Nested-set integration (Frappe 16)

    services:
      redis-cache:
        image: redis:7-alpine
        ports:
          - 13000:6379
      redis-queue:
        image: redis:7-alpine
        ports:
          - 11000:6379
      mariadb:
        image: mariadb:11.8
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mariadb-admin ping" --health-interval=5s --health-timeout=2s --health-retries=3

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout Frappe 16 source
        uses: actions/checkout@v4
        with:
          repository: frappe/frappe
          ref: version-16
          path: frappe-src
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml
            frappe-src/pyproject.toml

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install MariaDB client when missing
        run: |
          if ! command -v mariadb >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y mariadb-client
          else
            echo "MariaDB client is already available; skipping package installation."
          fi
          sudo mkdir -p /etc/mysql/conf.d
          echo -e "[client]\nskip-ssl" | sudo tee /etc/mysql/conf.d/disable-ssl.cnf

      - name: Initialize Bench and database
        run: |
          python -m pip install frappe-bench
          bench init --skip-redis-config-generation --skip-assets --python "$(which python)" --frappe-path "$GITHUB_WORKSPACE/frappe-src" ~/frappe-bench
          mariadb --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL character_set_server = 'utf8mb4'"
          mariadb --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL collation_server = 'utf8mb4_unicode_ci'"

      - name: Install app and create test site
        working-directory: /home/runner/frappe-bench
        run: |
          bench get-app flexirule "$GITHUB_WORKSPACE"
          bench setup requirements --dev
          bench new-site --db-root-password root --admin-password admin test_site
          bench --site test_site install-app flexirule
        env:
          CI: "Yes"

      - name: Run nested-set integration tests
        working-directory: /home/runner/frappe-bench
        run: |
          bench --site test_site set-config allow_tests true
          bench --site test_site run-tests --module flexirule.ruleflow.tests.test_fetch_records_tree_operators
        env:
          TYPE: server
