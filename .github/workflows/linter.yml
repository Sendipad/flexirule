name: Linters

on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "docs-config/**"
      - "landing-page/**"
      - "architecture/**"
      - "*.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pre-commit:
    name: "Frappe Linter"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Cache pre-commit environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: ${{ runner.os }}-pre-commit-py310-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pre-commit-py310-

      - name: Run pre-commit hooks
        uses: pre-commit/action@v3.0.1

      - name: Download Semgrep rules
        if: ${{ github.event_name == 'pull_request' }}
        run: git clone --depth 1 https://github.com/frappe/semgrep-rules.git frappe-semgrep-rules

      - name: Run Semgrep rules
        if: ${{ github.event_name == 'pull_request' }}
        env:
          SEMGREP_BASELINE_REF: ${{ github.event.pull_request.base.sha }}
        run: |
          python -m pip install semgrep
          semgrep ci --config ./frappe-semgrep-rules/rules --config r/python.lang.correctness

  deps-vulnerable-check:
    name: "Vulnerable Dependency Check"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install and run pip-audit
        run: |
          python -m pip install pip-audit
          pip-audit --desc on .

  fast-js-unit-tests:
    name: Fast JavaScript unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Run standalone unit tests
        run: |
          node flexirule/public/js/flexirule/core/contracts_return_schema.test.mjs
          node flexirule/public/js/flexirule/rule_builder/components/rule_config/query_filters/filter_operators.test.mjs
          node flexirule/public/js/flexirule/rule_builder/controls/generic_grid_model.test.mjs
          node flexirule/public/js/flexirule/rule_builder/components/rule_config/types/query_records/output_field_info.test.mjs
          node flexirule/public/js/flexirule/rule_builder/components/tree_builder/tree_builder_drag_model.test.mjs
          node flexirule/public/js/flexirule/rule_builder/components/rule_config/types/query_records/schema_refresh.test.mjs
          node flexirule/public/js/flexirule/rule_builder/components/rule_config/types/query_records/output_fields_schema.test.mjs
          node flexirule/public/js/flexirule/rule_builder/utils/stable_serialization.test.mjs
          node flexirule/public/js/flexirule/rule_builder/utils/graph_dirty_state.test.mjs
          node flexirule/public/js/flexirule/rule_builder/utils/config_save_lifecycle.test.mjs
